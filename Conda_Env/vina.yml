# =============================================================================
# Analysis / screening environment for the thesis.
#
#   Regenerated 2026-09-02 from the live `vina` env with `conda env export`.
#
#   The previous committed version of this file pinned python 3.11.15,
#   numpy 2.4.3, pandas 3.0.1, rdkit 2025.9.6 and scipy 1.17.1. None of those
#   is what produced the reported results. Appendix B states the screening
#   environment as Python 3.12.12, RDKit 2025.09.1 (distributed as 2025.9.1),
#   NumPy 2.3.4, SciPy 1.16.2, pandas 2.3.3 and scikit-learn 1.8.0, and adds
#   that "most PoseBusters verdicts are tied to this exact version" of RDKit,
#   because its distance-geometry bounds set the bond-length and bond-angle
#   tolerances and its UFF supplies the internal-energy reference ensemble.
#   The old file therefore rebuilt an environment that could not reproduce the
#   validity verdicts the thesis reports.
#
#   ONE PATCH IS NOT CAPTURED HERE. posebusters/modules/energy_ratio.py is
#   patched locally, as Appendix B records: the handler guarding the UFF
#   parameter check logs the exception instead of indexing its second argument.
#   Without it, bust() aborts on any ligand UFF cannot parameterise. Apply it
#   after creating the env; Thesis_Reproduction.ipynb asserts it is present.
#
#   Create with:  conda env create -f Conda_Env/vina.yml
# =============================================================================
name: vina
