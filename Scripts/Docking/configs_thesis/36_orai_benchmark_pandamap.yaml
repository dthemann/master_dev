# ============================================================================
# THESIS REPRODUCTION CONFIG - PandaMap fingerprints (Orai1 control panel)
#
#   Thesis section  : App. B "Interaction Fingerprints"
#   Supports        : Table 12; Figures 13, 14, 25, 26
#   Dataset         : Orai1 control panel, 308 benchmark ligands x 4 receptor frames = 1,232 units
#   Driver          : Analysis/run_pandamap.py -c <this>
#   Writes          : pandamap_results/orai_benchmark_matched
#   Analysis tree   : pandamap_results/orai_benchmark_matched
#
#   Copied from     : Scripts/Analysis/pandamap_orai_benchmark_matched_config.yaml
#   Deviations      : none - byte-identical body
#
#   Determinism     : bit-exact - deterministic post-processing of stored poses
#
#   This file is READ-ONLY to the pipeline. Thesis_Reproduction.ipynb loads it
#   and never writes it back. Rationale in THESIS_REPRODUCTION.md.
# ============================================================================
# PandaMap config — Orai × PoseBuster Benchmark ligands.
# Run under the vina env (only env with pandamap):
#   /home/manndo/anaconda3/envs/vina/bin/python Scripts/Analysis/run_pandamap.py \
#       --config Scripts/Analysis/pandamap_orai_benchmark_config.yaml
#   /home/manndo/anaconda3/envs/vina/bin/python Scripts/Analysis/pandamap_interaction_report.py \
#       --config Scripts/Analysis/pandamap_orai_benchmark_config.yaml
#
# NOTE: Orai has NO crystal reference (benchmark_dir: null) — so there is no
# native-interaction recovery and no oracle_rmsd metric. --best-equibind-only
# therefore does not apply here (left false); all EquiBind variants are shown.

work_dir: /home/manndo/master_dev

# ── Input — Mode A (PoseBusters CSV from run_posebusters) ─────────────────
# TRANSMEMBRANE-EXCLUDED pose set: poses docked in the TM1 conduction pore
# (Arg91↔Glu106) are removed by the transmembrane-exclusion cell in
# Master_Docking.ipynb (Scripts/Analysis/orai_transmembrane_exclusion.py). Point
# at the raw posebusters_filtered_results.csv to analyse ALL poses instead.
pb_csv: posebusters_results/_orai_matched_root/orai_benchmark/dock/posebusters_filtered_results.no_tm.csv
pb_valid_only: true        # true → only poses that passed every PoseBusters test

# ── Crystal reference: none for Orai ──────────────────────────────────────
benchmark_dir: null

# ── Output ────────────────────────────────────────────────────────────────
output_dir: pandamap_results/orai_benchmark_matched

# ── Behaviour ─────────────────────────────────────────────────────────────
poses_per_combo: 10        # fingerprint a wider pool; the compare applies its own top-3 cap (matches the published pipeline)
render_images: false        # fingerprints only; Figures 13-14 read pandamap_interactions.csv, never the per-pose 2D maps
split_equibind: true
use_dssp: false
num_workers: 28
overwrite: false

# ── Best-EquiBind filter — N/A without a crystal/oracle metric ────────────
best_equibind_only: false
