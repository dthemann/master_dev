# Interim PoseBusters campaign for the first completed optimization arm only:
# AutoDock Vina source scoring + GNINA CNN rescore (optimizer label `gnina`).
#
# This has its own output tree and therefore cannot prune or merge rows from the
# later strict four-arm Vina/Vinardo rescore/refinement campaign.

work_dir: /home/manndo/master_dev

# Required by the schema but unused with prepared_per_pose.
receptors_dir: posebusters_results/_benchmark_staging/receptors

docking_directories:
  autodock: Dockings/vina_results_full_protein_vina_scoring

config_mode: dock
receptor_policy: prepared_per_pose
require_validation_receptors: true

validation_receptor_directories:
  autodock: Dockings/vina_results_full_protein_vina_scoring

variant_filter:
  autodock:
    - gnina

require_all_methods: true
require_complete_results: true
optional_methods: []
expected_common_combinations: 308

overwrite: false
save_interval: 200
num_workers: 8
quiet: true
limit_worker_threads: true
worker_maxtasks: 50
pose_timeout: 600
stall_timeout: 1800
max_restarts: 5
monitor: true
monitor_interval: 30

output_base_dir: posebusters_results/benchmark_full_protein_autodock_vina_gnina_rescore_8w

ligand_template_dirs:
  - Data/PoseBuster Benchmark Set

copy_proved_poses: true
make_plots: true
