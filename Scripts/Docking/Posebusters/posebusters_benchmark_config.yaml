# PoseBusters config — Benchmark dockings (AutoDock + DiffDock + EquiBind)
# ------------------------------------------------------------------------
# Validates poses produced by the three benchmark docking cells in
# Master_Docking.ipynb against the PoseBuster Benchmark receptors.
#
# The notebook cell that drives this config first stages the benchmark
# docking outputs into the flat layout each collector expects, under
# `posebusters_results/_benchmark_staging/`.

work_dir: /home/manndo/master_dev

# Staged receptors: symlinks to <pdb_id>_protein.pdb for every benchmark complex.
receptors_dir: posebusters_results/_benchmark_staging/receptors

# Staged docking outputs (created by the notebook cell):
#   autodock/  : <pdb_id>__<pdb_id>_vina_out.pdbqt symlinks
#   diffdock/  : <pdb_id>__<pdb_id>/ subdir with the SDF poses
#   equibind/  : <pdb_id>__<pdb_id>/ subdir with the SDF poses
docking_directories:
  autodock:        posebusters_results/_benchmark_staging/autodock
  diffdock:        posebusters_results/_benchmark_staging/diffdock
  equibind_guided: posebusters_results/_benchmark_staging/equibind

# "dock" runs PoseBusters with the receptor; falls back to "mol" if the
# receptor PDB cannot be resolved for a given pose.
config_mode: dock

save_interval: 200
overwrite: false
num_workers: null

# All PoseBusters CSVs / PNGs land here:
output_base_dir: posebusters_results/benchmark

# Bond-order template SDFs for AutoDock PDBQT -> SDF conversion.
# The benchmark crystal ligands serve as perfect templates.
ligand_template_dirs:
  - Data/PoseBuster Benchmark Set

copy_proved_poses: true
make_plots: true

# HETATM keep-mode (preferred). Validate against EXACTLY the atoms the docker
# saw: keep only the injected cofactor+metal set and strip every other HETATM
# (buffers, glycans, cognate-ligand remnants, stray chloride, ...). "auto"
# pulls the same DEFAULT_KEEP_COFACTORS|DEFAULT_KEEP_METALS that the docking
# step injects when `retain_hetatm_residues: true`, so the two stay in lock-step
# and PoseBusters can only ever flag clashes against atoms Vina was given.
# Set to an explicit list to override, or remove/false to fall back to the
# explicit `strip_hetatm_residues` list below.
keep_hetatm_residues: auto

# Legacy explicit-strip list. IGNORED while keep_hetatm_residues is set above;
# retained for reference / for runs that disable keep-mode.
strip_hetatm_residues:
  # waters / heavy-atom waters
  - HOH
  - WAT
  - DOD
  # solvents & cryoprotectants
  - EDO   # ethylene glycol
  - GOL   # glycerol
  - DMS   # DMSO
  - PEG   # polyethylene glycol
  - PGE   # triethylene glycol
  - MPD   # 2-methyl-2,4-pentanediol
  - IPA   # isopropanol
  - BME   # beta-mercaptoethanol
  - MES   # MES buffer
  - EPE   # HEPES buffer
  - TRS   # Tris buffer
  - BTB   # Bis-tris buffer
  - BCN   # bicine buffer
  - CIT   # citrate
  - IMD   # imidazole (often crystallisation aid, not cofactor)
  # small acidic / ionic crystallisation additives
  - FMT   # formate
  - ACT   # acetate
  - SO4   # sulfate
  - PO4   # phosphate
  - NO3   # nitrate
  - CO3   # carbonate
  - NH4   # ammonium
  - SCN   # thiocyanate
  - IOD   # iodide
  - BR    # bromide
  # benign monatomic halides commonly from buffer (kept conservative; metal
  # coordination Cl/Na can be re-added by clearing this entry):
  # - CL
  # - NA
