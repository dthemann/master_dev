# PoseBusters config — Benchmark dockings (AutoDock + DiffDock + EquiBind)
# ------------------------------------------------------------------------
# Validates poses produced by the three benchmark docking cells in
# Master_Docking.ipynb against the PoseBuster Benchmark receptors.
#
# DiffDock and EquiBind are staged as symlinked combo directories. AutoDock is
# read directly from the completed full-protein Vina tree so its original
# receptor stem/provenance cannot be erased by flat-link renaming.

work_dir: /home/manndo/master_dev

# Legacy schema field; ignored by receptor_policy: prepared_per_pose below.
# No shared receptor staging file participates in this benchmark.
receptors_dir: posebusters_results/_benchmark_staging/receptors

# Docking outputs:
#   autodock   : nested completed full-protein Vina outputs
#   unidock    : transactionally complete tiled Uni-Dock merged outputs (optional;
#                uncomment only after that campaign has completed)
#   diffdock/  : <pdb_id>__<pdb_id>/ subdir with the SDF poses
#   equibind/  : <pdb_id>__<pdb_id>/ subdir with the SDF poses
docking_directories:
  autodock:        Dockings/vina_results_full_protein_vina_scoring
  # unidock:       Dockings/unidock_results_full_protein_vina_scoring
  diffdock:        posebusters_results/_benchmark_staging/diffdock
  equibind_guided: posebusters_results/_benchmark_staging/equibind

# Validate every pose against the prepared receptor used by its final
# receptor-dependent docking stage. Missing methods/receptors are fatal; the
# benchmark must never silently become a two-method or ligand-only run.
config_mode: dock
receptor_policy: prepared_per_pose
require_all_methods: true
require_validation_receptors: true
# Fatal on any failed pose inside the collected three-method intersection.
# Incomplete combo directories are warned about and excluded before intersection.
require_complete_results: true
# Reproducibility lock for the currently finalized cohort. 7WCF_ACP is now
# counted: its EquiBind run was re-finalized (guided_results.json reconstructed
# from the 244 loadable refined pose SDFs; 4 corrupt partial-write SDFs dropped),
# so all three methods now have it. Cohort raised 302 -> 303. The remaining gap
# to 307 is the 5 DiffDock preprocessing skips (7B2C_TP7, 7D6O_MTE, 7FRX_O88,
# 7M31_TDR, 8F4J_PHO).
expected_common_combinations: 303
validation_receptor_directories:
  autodock:        Dockings/vina_results_full_protein_vina_scoring
  # Uni-Dock reuses the exact prepared AutoDock receptor tree, not its output tree.
  # unidock:       Dockings/vina_results_full_protein_vina_scoring
  diffdock:        Dockings/Benchmark_DiffDock
  equibind_guided: Dockings/Benchmark_Equibind

# When AutoDock optimization outputs are present, select exactly one rank/geometry
# family for a canonical three-/four-tool comparison. Remove the block to validate
# every committed original/smina/gnina variant side by side.
# variant_filter:
#   autodock: original       # or smina / gnina
#   unidock: tiled

save_interval: 200
overwrite: false
num_workers: 0

# ---------------------------------------------------------------------------
# Performance / stability (added to stop long runs stalling after a few 1000
# poses). These values are explicit benchmark choices; they are not all the
# runner's generic defaults.
# ---------------------------------------------------------------------------

# Suppress warning chatter — all Python warnings (incl. the repeated pandas
# "DataFrame concatenation with all-NA columns" FutureWarning) and every RDKit
# log line — plus the verbose per-file listings (HETATM strip table, the full
# protein-file dump, per-model conversion notes). Progress, checkpoint and
# summary lines are kept. Same as passing --quiet / -q on the command line.
quiet: true

# Cap intra-worker thread fan-out so N Pool workers don't oversubscribe the CPU.
# PoseBusters' internal-energy check embeds + UFF-minimises a 50-conformer
# ensemble per pose using ALL cores (RDKit num_threads=0); with one worker per
# core that is N x cores threads fighting over N cores, which is the main reason
# a run crawls to a halt under load. We already parallelise at the pose level,
# so each worker is forced single-threaded instead. Leave true unless you run a
# single worker and want RDKit to parallelise internally.
limit_worker_threads: true

# Recycle each worker process after this many poses. Bounds the RDKit conformer
# cache / memory growth that otherwise accumulates over a long run and tips into
# swap thrashing (the classic "stalls after a few thousand poses"). Set to 0 or
# null to keep workers alive for the whole run. CLI: --max-tasks-per-child.
worker_maxtasks: 200

# Per-pose killing would change benchmark coverage relative to a normal stock
# PoseBusters call, so it is disabled here. The pool-level stall watchdog below
# can still recover from a dead/wedged worker, and require_complete_results makes
# any unrecovered pose fatal instead of publishing a partial benchmark.
pose_timeout: null

# Stall recovery. A dead worker — e.g. OOM-killed under memory pressure, which
# this WSL2 box is prone to (swap already heavily used) — makes the Pool's
# result iterator block FOREVER waiting for a result that never comes. That is
# the true "stuck after a few thousand busts with no error". If no pose
# completes for `stall_timeout` seconds the pool is declared wedged, terminated,
# and restarted on the not-yet-done poses, halving the worker count each time to
# relieve memory, up to `max_restarts` times. Poses already written to the CSV
# are never re-run. null -> auto = max(pose_timeout, 300) x 3; 0 -> disable.
stall_timeout: null
max_restarts: 5

# Live resource monitor (diagnostic; off by default). A background thread prints
# a snapshot every `monitor_interval` seconds — system CPU / load / RAM / swap,
# then the worker pool's aggregate CPU%, thread count and RSS, the derived
# "cores busy", and pose throughput — and flags oversubscription, swap / memory
# pressure, under-utilisation and busy-but-no-progress. Use it to SEE which
# bottleneck is biting. Needs psutil for per-process detail (installed here);
# without it, still reports load average + memory / swap. CLI: --monitor,
# --monitor-interval.
monitor: true
monitor_interval: 30

# All PoseBusters CSVs / PNGs land here:
output_base_dir: posebusters_results/benchmark_full_protein_vina_scoring

# Bond-order templates for legacy PDBQTs without embedded Meeko SMILES. Current
# Vina outputs use the embedded SMILES and fail closed if Meeko cannot export.
ligand_template_dirs:
  - Data/PoseBuster Benchmark Set

copy_proved_poses: true
make_plots: true

# No HETATM allow/deny list is used in this benchmark. Receptor membership is
# derived from the immutable prepared artifact associated with each pose.
