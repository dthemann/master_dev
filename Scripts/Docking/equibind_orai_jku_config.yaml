# ═══════════════════════════════════════════════════════════════════════════════
# EquiBind — ORAI1 x JKU EXPERIMENTAL arm (2-APB, GSK-7975A, Synta-66)
#
# Consumed by: Master_Docking.ipynb cell eqbnd-run-001 (and the same cell in
#              Master_Docking_AD_Full_Protein.ipynb), which iterates ligand_dirs
#              and invokes Scripts/Docking/run_equibind.py once per directory.
# Produces:    Dockings/equibind_results/<ligand-dir-name>/
#
# WHY THIS FILE EXISTS
# Until 2026-08-17 this arm shared equibind_docking_config.yaml with the
# calibration benchmark, and the config-editor cell 4d02725a rewrote that shared
# file in place with this arm's values (also stripping every comment, because it
# re-dumps with yaml.safe_dump). The two arms ran with different settings, so one
# file could not reproduce both. They are now split. This file is the Orai x JKU
# half; the benchmark half is equibind_benchmark_config.yaml.
#
# PROVENANCE
# Values were taken from the executed run recorded in
# Dockings/equibind_results/*/pipeline_summary.json (key "config"). That arm
# writes a single summary, so there is one record rather than a per-complex set.
# Values the runner does not record are marked NOT LOGGED with their source.
#
# THIS ARM DIFFERS FROM THE BENCHMARK IN FIVE RECORDED KEYS
#   n_top_pockets     0    (benchmark 3)   guided docking off here
#   poses_per_pocket  3    (benchmark 10)  inert while n_top_pockets is 0
#   refine_mode       on   (benchmark both) no raw variant is kept here
#   refine_tool       gnina (benchmark both)
#   uff_minimize      true (benchmark false)
# The uff_minimize difference is the consequential one, because the in-protein UFF
# relaxation deforms ligand geometry while relieving clash. It means the Orai
# experimental panel and the Orai control panel (equibind_orai_benchmark_config.yaml,
# uff_minimize false) are NOT prepared identically, so the EquiBind cross-panel
# contrast carries a preparation difference as well as a ligand-set difference.
# The thesis records this in the Orai1 protocol table and reads that contrast as
# descriptive only. Do not "harmonise" this key without re-running the arm.
# ═══════════════════════════════════════════════════════════════════════════════

# ── Inputs ───────────────────────────────────────────────────────────────────
receptors_dir: Data/Receptors        # Orai1WT-MDSnap frames as *.pdb
ligand_dirs:
- Data/Ligands/JKU/pdbqt             # one EquiBind invocation per directory
receptor_name_filter: ''             # '' = every *.pdb in receptors_dir
ligand_extensions:
- .pdb

# ── Pocket guidance ──────────────────────────────────────────────────────────
# Inert for this arm: n_top_pockets is 0, so no guided poses are generated and the
# detector outputs are never read. Retained for schema parity.
fpocket_results_dir: pocket_results/fpocket_results
p2rank_results_dir: pocket_results/p2rank_results

# ── EquiBind model / launcher ────────────────────────────────────────────────
equibind_dir: /home/manndo/tools/EquiBind
equibind_python: /home/manndo/anaconda3/envs/equibind/bin/python
device: cuda

# ── Outputs ──────────────────────────────────────────────────────────────────
output_dir: Dockings/equibind_results_uffoff   # REPOINTED 2026-08-30, see uff_minimize below
log_dir: Dockings/Logs/equibind_logs

# ── Pose counts ──────────────────────────────────────────────────────────────
n_top_pockets: 0          # RUN VALUE: guided (fpocket/p2rank) docking OFF
poses_per_pocket: 3       # RUN VALUE, inert while n_top_pockets is 0
n_unguided_poses: 30      # bounded by len(rdkit_seeds) x conformers_per_seed = 30

# ── Pocket enforcement ───────────────────────────────────────────────────────
# All three keys are effectively inert for unguided poses, which have no guiding
# pocket to be clamped or rejected against.
pocket_match_threshold: 8.0
force_pocket: true
clamp_pose_to_pocket: true
clamp_mode: "off"         # quoted: unquoted off is boolean false in YAML 1.1

# ── Refinement ───────────────────────────────────────────────────────────────
refine_mode: "on"         # RUN VALUE. Quoted: unquoted on is boolean true in YAML 1.1.
                          # "on" REPLACES each pose with its refined version, so this
                          # arm keeps no __refRAW variant. The benchmark used "both"
                          # and does keep one. Any raw-versus-refined comparison is
                          # therefore available on the benchmark arm only.
refine_tool: gnina        # RUN VALUE: physics re-search plus CNN rescore
smina_search: local_only  # --local_only (bounded local search), NOT --minimize.
                          # The AutoDock and DiffDock arms use --minimize, so the
                          # refined EquiBind poses are not the product of the same
                          # operation. The thesis appendix records this.
smina_autobox_add: 4.0
smina_cpu: 1
smina_seed: 0
smina_timeout_s: 300
smina_receptor_ext: .pdb
smina_executable: ''      # autodetect
gnina_executable: /home/manndo/docking_tools/gnina
                          # NOT LOGGED. Set explicitly because refine_tool is gnina
                          # and the equibind conda env has no gnina on PATH, which is
                          # the same reason equibind_orai_benchmark_config.yaml sets it.
gnina_use_gpu: true       # NOT LOGGED. Taken from the shared config as it stood when
                          # this arm ran. Contrast the Orai control arm, which sets
                          # false to keep the GPU free for EquiBind.

# ── Protein cropping ─────────────────────────────────────────────────────────
use_protein_cropping: true
pocket_crop_radius: 8.0
pocket_crop_buffer: 3.0

# ── Unguided conformer generation (RDKit ETKDG) ──────────────────────────────
rdkit_seeds:
- 42
- 123
- 456
- 789
- 1001
- 2022
- 3141
- 5926
- 8675
- 9999
- 7
- 13
- 17
- 271
- 314
- 628
- 1234
- 1618
- 2718
- 4040
- 4242
- 5050
- 6060
- 7070
- 8080
- 9090
- 11111
- 22222
- 31415
- 65536
conformers_per_seed: 1

# ── UFF minimisation ─────────────────────────────────────────────────────────
uff_minimize: false       # CHANGED 2026-08-17. The reported Orai x JKU results were
                          # produced with this TRUE, which broke the ligands outright.
                          # Measured directly on the 479 readable poses of that run,
                          # 78.9% contain at least one bond longer than 1.9 Angstrom,
                          # the median pose's longest bond is 4.12 Angstrom against a
                          # normal C-C bond of about 1.54, and the worst single bond
                          # reaches 9,104 Angstrom. Re-running the identical arm with
                          # this key false, changing nothing else, gives a median
                          # longest bond of 1.53 Angstrom, a maximum of 1.6 and not one
                          # pose out of 480 carrying a bond over 1.9.
                          # Cause: uff.py fixes every protein atom (AddFixedPoint) and
                          # builds the field with ignoreInterfragInteractions=False, so
                          # on a buried pose the minimiser cannot slide the ligand out
                          # of the clash and relieves it by stretching the ligand apart.
                          # The benchmark and Orai control arms both ran false and are
                          # unaffected.
                          # NOTE ON DATA. The re-run lives in
                          # Dockings/equibind_results_uffoff/ and is a drop-in
                          # replacement, namely the same 16 combos and 480 poses with
                          # identical file naming.
                          # ADOPTED 2026-08-30. output_dir above and the equibind_guided
                          # entry in
                          # Scripts/Docking/Posebusters/posebusters_orai_jku_config.yaml
                          # now both point at the re-run, and the Orai1 EquiBind analyses
                          # were regenerated against it. The superseded UFF-on tree remains
                          # at Dockings/equibind_results/ and its PoseBusters output is
                          # archived at posebusters_results/orai_jku_UFFON_backup_20260830/.
uff_max_iters: 200
uff_energy_tol: 0.0001
uff_force_tol: 0.001
uff_proximity_radius: 6.0
uff_add_hydrogens: true
uff_strip_nonstandard: true
uff_vdw_thresh: 10.0

# ── Parallelism / rerun ──────────────────────────────────────────────────────
gpu_batch_size: 8
n_parallel_workers: 32    # RUN VALUE
parallel_conformer_gen: true
skip_existing: false
