# PandaMap interaction-fingerprint config — PoseBuster Benchmark dockings.
# Run under the vina env (only env with pandamap):
#   /home/manndo/anaconda3/envs/vina/bin/python Scripts/Analysis/run_pandamap.py \
#       --config Scripts/Analysis/pandamap_config.yaml
#
# Then the report:
#   /home/manndo/anaconda3/envs/vina/bin/python Scripts/Analysis/pandamap_interaction_report.py \
#       --in-dir pandamap_results/benchmark

work_dir: /home/manndo/master_dev

# ── Input — Mode A (PoseBusters CSV) ──────────────────────────────────────
# Reuse the per-pose table run_posebusters wrote (carries pose_file, protein,
# ligand, docking_method, protein_file_used + variant provenance columns).
pb_csv: posebusters_results/benchmark/dock/posebusters_filtered_results.csv
pb_valid_only: true        # true → only poses that passed every PoseBusters test

# ── Input — Mode B (directory scan) — used only if pb_csv is null ─────────
# docking_directories:
#   autodock:        posebusters_results/_benchmark_staging/autodock
#   diffdock:        posebusters_results/_benchmark_staging/diffdock
#   equibind_guided: posebusters_results/_benchmark_staging/equibind
# receptors_dir:     posebusters_results/_benchmark_staging/receptors

# ── Crystal reference (native interaction fingerprint) ────────────────────
# Per-complex crystal ligand at <benchmark_dir>/<pdb>/<pdb>_ligand.sdf.
benchmark_dir: Data/PoseBuster Benchmark Set

# ── Output ────────────────────────────────────────────────────────────────
# top-5 (poses_per_combo below), PB-valid, best-variant-per-tool set. The older
# pandamap_results/benchmark_best_equi holds a superseded top-3 run.
output_dir: pandamap_results/benchmark_best_equi

# ── Behaviour ─────────────────────────────────────────────────────────────
poses_per_combo: 5          # top-N ranked poses per (method, protein, ligand)
render_images: true         # 2D PNG maps (slow). false → fingerprints only (fast)
split_equibind: true        # fpocket/p2rank/clamp/refine as distinct methods
split_diffdock: true        # raw / smina-opt / gnina-opt as distinct methods
use_dssp: false             # PandaMap solvent accessibility via DSSP (needs mkdssp)
num_workers: null           # null → (CPU count − 1)
overwrite: false            # false → resume (skip poses already in the summary CSV)

# ── Best-EquiBind filter ──────────────────────────────────────────────────
# Map only the single best-performing EquiBind variant (highest
# oracle_rmsd_le_2.0A_%) alongside AutoDock/DiffDock, so discarded variants are
# never mapped. The metric is read from the posebusters_pose_comparison
# oracle_summary.csv. CLI --best-equibind-only / --oracle-summary override these.
# (Run the report with --best-equibind-only too, to label the variant "EquiBind*".)
best_equibind_only: false   # CLI --best-equibind-only sets this true
best_diffdock_only: false   # CLI --best-diffdock-only sets this true (best raw/smina/gnina)
oracle_summary: posebusters_results/benchmark/dock/pose_comparison_report/oracle_summary.csv

# ── Orai variant (swap the block above) ───────────────────────────────────
# pb_csv: posebusters_results/orai_benchmark/dock/posebusters_filtered_results.csv
# benchmark_dir: null          # no crystal reference for Orai
# output_dir: pandamap_results/orai_benchmark
