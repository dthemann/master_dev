    "DiffDock/near-native":               [0.6, 0.6, 0.4, 0.3, 0.8, 1.0]
    "DiffDock/PoseBusters-valid":         [57, 59, 60, 62, 63, 67]
    "DiffDock/near-native and PB-valid":  [16.5, 16.5, 10.5, 10.3, 6.5, 6.7]
