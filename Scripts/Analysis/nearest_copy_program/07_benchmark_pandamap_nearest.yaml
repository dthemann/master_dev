# NEAREST-COPY PROGRAM CONFIG - PandaMap interaction fingerprints (benchmark)
#
#   Copy of Scripts/Docking/configs_thesis/07_benchmark_pandamap.yaml for the nearest-copy
#   endpoint program (thesis_latex/PLAN_nearest_copy_primary_endpoint_2026-09-07_v2.md, Phase 2.2).
#   Deviations from 07: output_dir -> pandamap_results/benchmark_matched_equibind_nearest;
#   per_pose_metrics / oracle_summary -> .../pose_comparison_report_nearest/; crystal_copies: all.
#   The docked-pose fingerprints (pandamap_interactions.csv, pandamap_pose_summary.csv) were COPIED
#   from pandamap_results/benchmark_matched_equibind/ (pose selection and pb_valid do not depend on
#   the reference convention); only the crystal fingerprints were recomputed, with
#     run_pandamap.py -c <this> --refresh-crystal
#
#   Thesis section  : App. B "Interaction Fingerprints"; PandaMap 4.1.0
#   Supports        : Table 4; Figure 7
#   Dataset         : Calibration benchmark, 308 PoseBusters ligands (303 analysed)
#   Driver          : Analysis/run_pandamap.py -c <this>, then pandamap_interaction_report.py
#   Writes          : pandamap_results/benchmark_matched_equibind
#   Analysis tree   : pandamap_results/benchmark_matched_equibind
